<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserve Juggler — Institutional Treasury Engine</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Apache ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgDark: '#0B0F14',
            panelDark: '#121923',
            borderDark: '#1E2A38',
            accentBlue: '#4EA1FF',
            textLight: '#E6EDF3',
            textMuted: '#8B98A5',
            tierCash: '#8B98A5',
            tierRepo: '#3FB7A9',
            tierBond: '#E0B341',
            tierStock: '#C77DFF',
            tierOverdraft: '#FF6B6B',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0B0F14; color: #E6EDF3; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .mono-num { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body class="bg-bgDark min-h-screen text-textLight">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = window.location.origin;

    function formatUSD(cents) {
      if (cents === undefined || cents === null) return "$0.00";
      const num = Number(cents) / 100.0;
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
    }

    function App() {
      const [tab, setTab] = useState('dashboard');
      const [kpis, setKpis] = useState(null);
      const [reserves, setReserves] = useState(null);
      const [decisions, setDecisions] = useState([]);
      const [forecastData, setForecastData] = useState(null);
      const [isRunning, setIsRunning] = useState(false);
      const [auditStatus, setAuditStatus] = useState(null);
      const [backtestResults, setBacktestResults] = useState(null);
      const [backtestLoading, setBacktestLoading] = useState(false);
      const [stressReport, setStressReport] = useState(null);
      const [selectedScenario, setSelectedScenario] = useState('OUTFLOW_MULT');
      const [sweepAmount, setSweepAmount] = useState('10000000');
      const [sweepPreview, setSweepPreview] = useState(null);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Load initial state
      const fetchState = async () => {
        try {
          const kpiRes = await fetch(`${API_BASE}/api/v1/kpis?run_id=run_live_01`);
          if (kpiRes.ok) setKpis(await kpiRes.json());

          const resRes = await fetch(`${API_BASE}/api/v1/reserve?run_id=run_live_01`);
          if (resRes.ok) setReserves(await resRes.json());

          const decRes = await fetch(`${API_BASE}/api/v1/treasury/decisions?run_id=run_live_01&limit=20`);
          if (decRes.ok) setDecisions(await decRes.json());

          const fcRes = await fetch(`${API_BASE}/api/v1/forecast?run_id=run_live_01&horizon=24`);
          if (fcRes.ok) setForecastData(await fcRes.json());
        } catch (err) {
          console.error("Error fetching state:", err);
        }
      };

      useEffect(() => {
        fetchState();
      }, []);

      // Auto-step timer
      useEffect(() => {
        let interval = null;
        if (isRunning) {
          interval = setInterval(async () => {
            await handleStep();
          }, 1500);
        }
        return () => clearInterval(interval);
      }, [isRunning]);

      const handleStep = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/sim/runs/run_live_01/step`, {
            method: 'POST',
            headers: { 'Idempotency-Key': 'step_' + Date.now() }
          });
          if (res.ok) {
            await fetchState();
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleReset = async () => {
        setIsRunning(false);
        try {
          await fetch(`${API_BASE}/api/v1/sim/runs/run_live_01/reset`, { method: 'POST' });
          await fetchState();
        } catch (err) {
          console.error(err);
        }
      };

      const handleVerifyAudit = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/audit/verify?run_id=run_live_01`);
          if (res.ok) setAuditStatus(await res.json());
        } catch (err) {
          console.error(err);
        }
      };

      const handleRunBacktest = async () => {
        setBacktestLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/v1/backtests`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              horizon_steps: 168,
              strategies: ["B0_CASH", "B1_FIXED", "B2_CONSERVATIVE", "B3_DYNAMIC", "B4_CHALLENGE"]
            })
          });
          if (res.ok) {
            const data = await res.json();
            setBacktestResults(data.results);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setBacktestLoading(false);
        }
      };

      const handleRunStress = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/v1/stress/events`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              scenario_id: selectedScenario,
              start_step: kpis ? kpis.step + 1 : 17,
              duration_hours: 12
            })
          });
          if (res.ok) {
            setStressReport(await res.json());
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handlePreviewSweep = async () => {
        try {
          const cents = (parseFloat(sweepAmount) * 100).toString();
          const res = await fetch(`${API_BASE}/api/v1/treasury/sweeps/preview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tier: 1, amount_cents: cents })
          });
          if (res.ok) setSweepPreview(await res.json());
        } catch (err) {
          console.error(err);
        }
      };

      const handleExecuteSweep = async () => {
        try {
          const cents = (parseFloat(sweepAmount) * 100).toString();
          const res = await fetch(`${API_BASE}/api/v1/treasury/sweeps`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Idempotency-Key': 'man_swp_' + Date.now() },
            body: JSON.stringify({ tier: 1, amount_cents: cents, confirm: true })
          });
          if (res.ok) {
            alert("Sweep executed successfully!");
            setSweepPreview(null);
            await fetchState();
          } else {
            const err = await res.json();
            alert("Sweep rejected: " + JSON.stringify(err.detail));
          }
        } catch (err) {
          alert("Error executing sweep: " + err);
        }
      };

      // Render ECharts Liquidity Chart
      useEffect(() => {
        if (chartRef.current && kpis && reserves) {
          if (!chartInstance.current) {
            chartInstance.current = echarts.init(chartRef.current);
          }
          const option = {
            backgroundColor: 'transparent',
            tooltip: { trigger: 'axis' },
            legend: { data: ['Cash Buffer', 'Repo Position', 'R_total (Target)', 'F_hard (Floor)'], textStyle: { color: '#8B98A5' } },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: {
              type: 'category',
              data: [kpis.step - 2, kpis.step - 1, kpis.step],
              axisLine: { lineStyle: { color: '#1E2A38' } },
              axisLabel: { color: '#8B98A5' }
            },
            yAxis: {
              type: 'value',
              axisLine: { lineStyle: { color: '#1E2A38' } },
              axisLabel: { color: '#8B98A5', formatter: (v) => '$' + (v / 1e6).toFixed(0) + 'M' },
              splitLine: { lineStyle: { color: '#1E2A38' } }
            },
            series: [
              {
                name: 'Cash Buffer',
                type: 'bar',
                stack: 'total',
                color: '#8B98A5',
                data: [Number(kpis.cash_cents) / 100, Number(kpis.cash_cents) / 100, Number(kpis.cash_cents) / 100]
              },
              {
                name: 'Repo Position',
                type: 'bar',
                stack: 'total',
                color: '#3FB7A9',
                data: [Number(kpis.repo_cents) / 100, Number(kpis.repo_cents) / 100, Number(kpis.repo_cents) / 100]
              },
              {
                name: 'R_total (Target)',
                type: 'line',
                color: '#4EA1FF',
                lineStyle: { width: 3 },
                data: [Number(reserves.r_total_cents) / 100, Number(reserves.r_total_cents) / 100, Number(reserves.r_total_cents) / 100]
              },
              {
                name: 'F_hard (Floor)',
                type: 'line',
                color: '#FF6B6B',
                lineStyle: { type: 'dashed', width: 2 },
                data: [Number(reserves.f_hard_cents) / 100, Number(reserves.f_hard_cents) / 100, Number(reserves.f_hard_cents) / 100]
              }
            ]
          };
          chartInstance.current.setOption(option);
        }
      }, [kpis, reserves, tab]);

      return (
        <div className="flex flex-col min-h-screen">
          {/* Header */}
          <header className="border-b border-borderDark bg-panelDark px-6 py-4 flex items-center justify-between sticky top-0 z-50">
            <div className="flex items-center space-x-4">
              <span className="text-xl font-bold tracking-wider text-accentBlue flex items-center gap-2">
                ⚡ RESERVE JUGGLER
              </span>
              <span className="bg-blue-950 border border-blue-800 text-blue-300 text-xs px-2.5 py-1 rounded font-mono font-semibold">
                SIMULATION-ONLY
              </span>
              <span className="bg-emerald-950 border border-emerald-800 text-emerald-300 text-xs px-2.5 py-1 rounded font-mono">
                CYCLE #{kpis ? kpis.step : 0} (REPLAY)
              </span>
            </div>

            <nav className="flex space-x-1 bg-bgDark p-1 rounded-lg border border-borderDark text-sm">
              {['dashboard', 'forecast', 'sweep', 'backtest', 'stress', 'audit'].map((t) => (
                <button
                  key={t}
                  onClick={() => setTab(t)}
                  className={`px-3 py-1.5 rounded-md capitalize font-medium transition ${
                    tab === t ? 'bg-panelDark text-accentBlue border border-borderDark shadow' : 'text-textMuted hover:text-textLight'
                  }`}
                >
                  {t}
                </button>
              ))}
            </nav>

            {/* Simulation Controls */}
            <div className="flex items-center space-x-2">
              <button
                onClick={handleStep}
                className="bg-panelDark hover:bg-borderDark border border-borderDark px-3 py-1.5 rounded text-sm font-semibold flex items-center gap-1 text-textLight"
              >
                ▶ Step 1h
              </button>
              <button
                onClick={() => setIsRunning(!isRunning)}
                className={`px-3 py-1.5 rounded text-sm font-semibold ${
                  isRunning ? 'bg-amber-600 hover:bg-amber-700 text-white' : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                }`}
              >
                {isRunning ? '⏸ Pause' : '▶ Auto-Play'}
              </button>
              <button
                onClick={handleReset}
                className="bg-red-950 hover:bg-red-900 border border-red-800 text-red-300 px-3 py-1.5 rounded text-sm font-semibold"
              >
                ↺ Reset
              </button>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
            {/* KPI Cards Row */}
            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
              <div className="bg-panelDark border border-borderDark p-4 rounded-xl">
                <div className="text-xs text-textMuted font-medium uppercase tracking-wide">Cash Buffer</div>
                <div className="text-lg font-bold text-textLight mono-num mt-1">
                  {kpis ? formatUSD(kpis.cash_cents) : "..."}
                </div>
                <div className="text-xs text-emerald-400 mt-1">● Immediate Liquidity</div>
              </div>

              <div className="bg-panelDark border border-borderDark p-4 rounded-xl">
                <div className="text-xs text-textMuted font-medium uppercase tracking-wide">Reserve Floor (R_total)</div>
                <div className="text-lg font-bold text-accentBlue mono-num mt-1">
                  {kpis ? formatUSD(kpis.r_total_cents) : "..."}
                </div>
                <div className="text-xs text-textMuted mt-1">Probabilistic + Hard Floor</div>
              </div>

              <div className="bg-panelDark border border-borderDark p-4 rounded-xl">
                <div className="text-xs text-textMuted font-medium uppercase tracking-wide">Headroom</div>
                <div className={`text-lg font-bold mono-num mt-1 ${kpis && Number(kpis.headroom_cents) < 0 ? 'text-red-400' : 'text-emerald-400'}`}>
                  {kpis ? formatUSD(kpis.headroom_cents) : "..."}
                </div>
                <div className="text-xs text-textMuted mt-1">Cash minus R_total</div>
              </div>

              <div className="bg-panelDark border border-borderDark p-4 rounded-xl">
                <div className="text-xs text-textMuted font-medium uppercase tracking-wide">Tier 1 Repo Vault</div>
                <div className="text-lg font-bold text-tierRepo mono-num mt-1">
                  {kpis ? formatUSD(kpis.repo_cents) : "..."}
                </div>
                <div className="text-xs text-textMuted mt-1">{kpis ? kpis.open_repos : 0} open positions</div>
              </div>

              <div className="bg-panelDark border border-borderDark p-4 rounded-xl">
                <div className="text-xs text-textMuted font-medium uppercase tracking-wide">Cumulative Net Yield</div>
                <div className="text-lg font-bold text-amber-400 mono-num mt-1">
                  {kpis ? formatUSD(kpis.cumulative_net_pnl_cents) : "..."}
                </div>
                <div className="text-xs text-emerald-400 mt-1">Net of Penalties</div>
              </div>

              <div className="bg-panelDark border border-borderDark p-4 rounded-xl">
                <div className="text-xs text-textMuted font-medium uppercase tracking-wide">Payout Success</div>
                <div className="text-lg font-bold text-emerald-400 mono-num mt-1">
                  {kpis ? `${kpis.payout_success.success_rate_pct}%` : "100%"}
                </div>
                <div className="text-xs text-textMuted mt-1">{kpis ? kpis.payout_success.failed_events : 0} shortfalls</div>
              </div>
            </div>

            {/* TAB: DASHBOARD */}
            {tab === 'dashboard' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 bg-panelDark border border-borderDark rounded-xl p-5 flex flex-col">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="font-bold text-base text-textLight">Real-Time Liquidity Stack & Safety Bounds</h3>
                    <span className="text-xs text-textMuted">Live Ledger Balance vs R_total</span>
                  </div>
                  <div ref={chartRef} className="h-80 w-full"></div>
                </div>

                {/* Live Decision Feed */}
                <div className="bg-panelDark border border-borderDark rounded-xl p-5 flex flex-col">
                  <div className="flex items-center justify-between mb-3 border-b border-borderDark pb-2">
                    <h3 className="font-bold text-base text-textLight">Live Decision Feed</h3>
                    <span className="text-xs bg-bgDark px-2 py-0.5 rounded text-accentBlue border border-borderDark font-mono">
                      {decisions.length} recorded
                    </span>
                  </div>
                  <div className="space-y-2.5 overflow-y-auto max-h-80 pr-1 text-xs font-mono">
                    {decisions.map((d) => (
                      <div key={d.seq} className="p-2.5 rounded bg-bgDark border border-borderDark flex flex-col gap-1">
                        <div className="flex justify-between items-center text-textMuted">
                          <span className="font-bold text-accentBlue">STEP #{d.step_index}</span>
                          <span>{d.record_hash}</span>
                        </div>
                        <div className="font-semibold text-textLight">{d.action}</div>
                        <div className="text-textMuted text-[11px]">{d.reason}</div>
                      </div>
                    ))}
                    {decisions.length === 0 && (
                      <div className="text-center text-textMuted py-8">No decisions recorded yet.</div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: FORECAST */}
            {tab === 'forecast' && (
              <div className="bg-panelDark border border-borderDark rounded-xl p-6 space-y-6">
                <div className="flex justify-between items-center border-b border-borderDark pb-4">
                  <div>
                    <h2 className="text-lg font-bold text-textLight">Forecast Engine & Quantile Fan (M3 Model)</h2>
                    <p className="text-xs text-textMuted">Hour x Day-of-Week profile with calendar multipliers & empirical ratio quantiles</p>
                  </div>
                  <span className="bg-blue-950 border border-blue-800 text-blue-300 text-xs px-2.5 py-1 rounded font-mono">
                    Strict Anti-Leakage Guard Active
                  </span>
                </div>

                {forecastData && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-4">
                      <h4 className="font-bold text-sm text-tierRepo uppercase tracking-wide">Deposit Inflow Quantiles</h4>
                      <div className="space-y-2 text-xs font-mono">
                        {forecastData.deposits.map((d) => (
                          <div key={d.horizon_h} className="p-3 bg-bgDark rounded border border-borderDark flex justify-between">
                            <span className="text-accentBlue font-bold">Horizon +{d.horizon_h}h</span>
                            <span>P50: {formatUSD(d.p50_cents)}</span>
                            <span>P95: {formatUSD(d.p95_cents)}</span>
                            <span className="text-emerald-400">P99: {formatUSD(d.p99_cents)}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-4">
                      <h4 className="font-bold text-tierOverdraft uppercase tracking-wide">Withdrawal Outflow Quantiles</h4>
                      <div className="space-y-2 text-xs font-mono">
                        {forecastData.withdrawals.map((w) => (
                          <div key={w.horizon_h} className="p-3 bg-bgDark rounded border border-borderDark flex justify-between">
                            <span className="text-amber-400 font-bold">Horizon +{w.horizon_h}h</span>
                            <span>P50: {formatUSD(w.p50_cents)}</span>
                            <span>P95: {formatUSD(w.p95_cents)}</span>
                            <span className="text-red-400">P99: {formatUSD(w.p99_cents)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB: MANUAL SWEEP */}
            {tab === 'sweep' && (
              <div className="max-w-2xl mx-auto bg-panelDark border border-borderDark rounded-xl p-6 space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-textLight">Manual Treasury Sweep Order</h2>
                  <p className="text-xs text-textMuted">Propose an immediate sweep into Tier 1 Repo subject to invariant safety checks</p>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="text-xs font-semibold text-textMuted uppercase">Sweep Amount (USD)</label>
                    <input
                      type="number"
                      value={sweepAmount}
                      onChange={(e) => setSweepAmount(e.target.value)}
                      className="w-full bg-bgDark border border-borderDark rounded p-3 text-textLight font-mono mt-1 text-base focus:border-accentBlue focus:outline-none"
                    />
                  </div>

                  <div className="flex gap-3">
                    <button
                      onClick={handlePreviewSweep}
                      className="flex-1 bg-panelDark hover:bg-borderDark border border-borderDark py-2.5 rounded font-semibold text-sm text-textLight transition"
                    >
                      🔍 Preview Invariants
                    </button>
                    <button
                      onClick={handleExecuteSweep}
                      disabled={!sweepPreview || !sweepPreview.valid}
                      className={`flex-1 py-2.5 rounded font-semibold text-sm transition ${
                        sweepPreview && sweepPreview.valid
                          ? 'bg-emerald-600 hover:bg-emerald-700 text-white'
                          : 'bg-borderDark text-textMuted cursor-not-allowed'
                      }`}
                    >
                      ⚡ Execute Sweep
                    </button>
                  </div>

                  {sweepPreview && (
                    <div className="p-4 bg-bgDark rounded-lg border border-borderDark space-y-2 text-xs font-mono">
                      <div className="flex justify-between">
                        <span className="text-textMuted">Sweep Status:</span>
                        <span className={sweepPreview.valid ? "text-emerald-400 font-bold" : "text-red-400 font-bold"}>
                          {sweepPreview.valid ? "VALID — ALL INVARIANTS PASS" : "REJECTED"}
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-textMuted">Available Surplus:</span>
                        <span>{formatUSD(sweepPreview.sweepable_surplus_cents)}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-textMuted">Headroom After Sweep:</span>
                        <span>{formatUSD(sweepPreview.headroom_after_cents)}</span>
                      </div>
                      {sweepPreview.reason_codes.length > 0 && (
                        <div className="text-red-400 pt-2 border-t border-borderDark">
                          Rejection Reasons: {sweepPreview.reason_codes.join(", ")}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB: BACKTESTING (B0-B4) */}
            {tab === 'backtest' && (
              <div className="bg-panelDark border border-borderDark rounded-xl p-6 space-y-6">
                <div className="flex justify-between items-center border-b border-borderDark pb-4">
                  <div>
                    <h2 className="text-lg font-bold text-textLight">Walk-Forward Strategy Comparison (B0–B4)</h2>
                    <p className="text-xs text-textMuted">168-hour common horizon walk-forward replay with identical opening capital ($3.0B)</p>
                  </div>
                  <button
                    onClick={handleRunBacktest}
                    disabled={backtestLoading}
                    className="bg-accentBlue hover:bg-blue-600 text-bgDark px-4 py-2 rounded font-bold text-sm transition"
                  >
                    {backtestLoading ? "Running Replay..." : "▶ Run Backtest Replay"}
                  </button>
                </div>

                {backtestResults && (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-bgDark text-textMuted border-b border-borderDark uppercase">
                        <tr>
                          <th className="p-3">Strategy</th>
                          <th className="p-3">Status</th>
                          <th className="p-3">Payout Success</th>
                          <th className="p-3">Gross Yield</th>
                          <th className="p-3">Net Realized Yield</th>
                          <th className="p-3">Peak Overdraft</th>
                          <th className="p-3">Avg Cash Buffer</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-borderDark">
                        {backtestResults.map((r) => (
                          <tr key={r.strategy_id} className="hover:bg-bgDark/50">
                            <td className="p-3 font-bold text-accentBlue">{r.strategy_id}</td>
                            <td className="p-3">
                              <span className="bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded text-[11px]">
                                {r.status}
                              </span>
                            </td>
                            <td className="p-3 text-emerald-400">{r.payout_success_steps_pct}%</td>
                            <td className="p-3">{formatUSD(r.gross_yield_usd * 100)}</td>
                            <td className="p-3 font-bold text-amber-400">{formatUSD(r.net_yield_usd * 100)}</td>
                            <td className="p-3">{formatUSD(r.overdraft_peak_usd * 100)}</td>
                            <td className="p-3 text-textMuted">{formatUSD(r.avg_cash_usd * 100)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* TAB: STRESS TESTING */}
            {tab === 'stress' && (
              <div className="bg-panelDark border border-borderDark rounded-xl p-6 space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-textLight">Stress Testing Scenario Injector</h2>
                  <p className="text-xs text-textMuted">Inject any of the 10 PRD §11.2 stress scenarios and measure real financial resilience</p>
                </div>

                <div className="flex gap-4 items-end max-w-xl">
                  <div className="flex-1">
                    <label className="text-xs text-textMuted font-bold uppercase">Select Scenario</label>
                    <select
                      value={selectedScenario}
                      onChange={(e) => setSelectedScenario(e.target.value)}
                      className="w-full bg-bgDark border border-borderDark rounded p-2.5 text-sm text-textLight mt-1"
                    >
                      <option value="OUTFLOW_MULT">3x Outflow Multiplier (6h)</option>
                      <option value="WITHDRAWAL_SPIKE">$150M Outflow Spike</option>
                      <option value="DELAYED_DEPOSITS">Delayed Deposits (6h)</option>
                      <option value="REPO_UNAVAILABLE">Repo Window Lockout (48h)</option>
                      <option value="LIQUIDATION_DELAY">+48h Settlement Lag</option>
                      <option value="BOND_SHOCK">+150bp Bond Yield Shock</option>
                      <option value="EQUITY_CRASH">-25% Equity Crash</option>
                      <option value="CORRELATED_RUN">Correlated Outflows + Market Shock</option>
                      <option value="OVERDRAFT_RESTRICTED">Overdraft Capped at 0.25x</option>
                      <option value="COMBINED_WORST">Combined Worst-Case Drill</option>
                    </select>
                  </div>
                  <button
                    onClick={handleRunStress}
                    className="bg-tierOverdraft hover:bg-red-600 text-white px-5 py-2.5 rounded font-bold text-sm transition"
                  >
                    ⚡ Inject Stress
                  </button>
                </div>

                {stressReport && (
                  <div className="p-4 bg-bgDark rounded-xl border border-borderDark space-y-3 font-mono text-xs max-w-2xl">
                    <div className="text-sm font-bold text-accentBlue">STRESS REPORT: {stressReport.scenario_id}</div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>Min Stressed Cash: <span className="font-bold">{formatUSD(stressReport.min_cash_stressed_cents)}</span></div>
                      <div>Peak Overdraft: <span className="font-bold">{formatUSD(stressReport.overdraft_peak_stressed_cents)}</span></div>
                      <div>Net P&L Impact: <span className="font-bold text-red-400">{formatUSD(stressReport.net_pnl_delta_cents)}</span></div>
                      <div>Payout Shortfalls: <span className="font-bold text-emerald-400">{stressReport.payout_failures_stressed}</span></div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB: AUDIT & LEDGER */}
            {tab === 'audit' && (
              <div className="bg-panelDark border border-borderDark rounded-xl p-6 space-y-6">
                <div className="flex justify-between items-center border-b border-borderDark pb-4">
                  <div>
                    <h2 className="text-lg font-bold text-textLight">Tamper-Evident SHA-256 Audit Trail</h2>
                    <p className="text-xs text-textMuted">Cryptographic hash chain proving ledger transactions have not been altered or reordered</p>
                  </div>
                  <button
                    onClick={handleVerifyAudit}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded font-bold text-sm transition"
                  >
                    ✔ Verify Hash Chain
                  </button>
                </div>

                {auditStatus && (
                  <div className={`p-4 rounded-lg border font-mono text-xs ${
                    auditStatus.valid ? "bg-emerald-950/50 border-emerald-800 text-emerald-300" : "bg-red-950/50 border-red-800 text-red-300"
                  }`}>
                    <div className="font-bold text-sm">
                      {auditStatus.valid ? "✔ AUDIT CHAIN VERIFIED: 100% UNBROKEN INTEGRITY" : "✖ AUDIT CHAIN COMPROMISED"}
                    </div>
                    <div>Checked Records: {auditStatus.checked_records} consecutive decisions and transactions.</div>
                  </div>
                )}

                <div className="space-y-2">
                  <h4 className="text-xs uppercase text-textMuted font-bold">Recent Cryptographic Records</h4>
                  <div className="space-y-2 font-mono text-xs">
                    {decisions.slice(0, 8).map((d) => (
                      <div key={d.seq} className="p-3 bg-bgDark rounded border border-borderDark flex justify-between items-center">
                        <div>
                          <span className="font-bold text-accentBlue">Seq #{d.seq}</span> · <span className="text-textLight">{d.action}</span>
                        </div>
                        <div className="text-textMuted text-[11px]">
                          Prev: {d.prev_hash} → Hash: {d.record_hash}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-borderDark bg-panelDark px-6 py-3 text-xs text-textMuted flex justify-between items-center">
            <span className="font-mono">Reserve Juggler v1.3 · Mode: SIMULATION — no real funds moved</span>
            <span>Single Source of Truth: Double-Entry Ledger (Integer Cents)</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
