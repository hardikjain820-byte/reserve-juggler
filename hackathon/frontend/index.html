<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserve Juggler — Institutional Treasury Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgDark: '#0B0F14',
            panelDark: '#121923',
            borderDark: '#1E2A38',
            accentBlue: '#4EA1FF',
            textLight: '#E6EDF3',
            textMuted: '#8B98A5',
            tierCash: '#8B98A5',
            tierRepo: '#3FB7A9',
            tierBond: '#E0B341',
            tierStock: '#C77DFF',
            tierOverdraft: '#FF6B6B'
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #0B0F14;
      color: #E6EDF3;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    .mono-num {
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>

<body class="bg-bgDark min-h-screen text-textLight">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = window.location.origin;

    function formatUSD(cents) {
      if (cents === undefined || cents === null) return "$0.00";

      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD'
      }).format(Number(cents) / 100);
    }

    function App() {
      const [tab, setTab] = useState('dashboard');
      const [kpis, setKpis] = useState(null);
      const [reserves, setReserves] = useState(null);
      const [decisions, setDecisions] = useState([]);
      const [forecastData, setForecastData] = useState(null);
      const [isRunning, setIsRunning] = useState(false);
      const [auditStatus, setAuditStatus] = useState(null);
      const [backtestResults, setBacktestResults] = useState(null);
      const [backtestLoading, setBacktestLoading] = useState(false);
      const [stressReport, setStressReport] = useState(null);
      const [selectedScenario, setSelectedScenario] = useState('OUTFLOW_MULT');
      const [sweepAmount, setSweepAmount] = useState('10000000');
      const [sweepPreview, setSweepPreview] = useState(null);
      const [chartHistory, setChartHistory] = useState([]);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const historyRef = useRef([]);
      const stepInFlight = useRef(false);

      async function fetchState(resetHistory = false) {
        try {
          const [kpiRes, resRes, decRes, fcRes] = await Promise.all([
            fetch(`${API_BASE}/api/v1/kpis?run_id=run_live_01`),
            fetch(`${API_BASE}/api/v1/reserve?run_id=run_live_01`),
            fetch(`${API_BASE}/api/v1/treasury/decisions?run_id=run_live_01&limit=20`),
            fetch(`${API_BASE}/api/v1/forecast?run_id=run_live_01&horizon=24`)
          ]);

          let nextKpis = null;
          let nextReserves = null;

          if (kpiRes.ok) {
            nextKpis = await kpiRes.json();
            setKpis(nextKpis);
          }

          if (resRes.ok) {
            nextReserves = await resRes.json();
            setReserves(nextReserves);
          }

          if (decRes.ok) {
            const data = await decRes.json();
            setDecisions(Array.isArray(data) ? data : (data.decisions || []));
          }

          if (fcRes.ok) {
            setForecastData(await fcRes.json());
          }

          if (nextKpis && nextReserves) {
            const snapshot = {
              step: Number(nextKpis.step ?? nextKpis.step_index ?? 0),
              cash: Number(nextKpis.cash_cents ?? 0) / 100,
              repo: Number(nextKpis.repo_cents ?? 0) / 100,
              reserve: Number(
                nextReserves.r_total_cents ??
                nextKpis.r_total_cents ??
                0
              ) / 100,
              hardFloor: Number(
                nextReserves.f_hard_cents ??
                nextKpis.f_hard_cents ??
                0
              ) / 100
            };

            // Keep one snapshot per simulation step.
            // Sort by step number so delayed responses cannot reorder the graph.
            const previous = resetHistory ? [] : historyRef.current;
            const snapshotsByStep = new Map(
              previous.map(point => [Number(point.step), point])
            );

            snapshotsByStep.set(Number(snapshot.step), snapshot);

            const updated = [...snapshotsByStep.values()]
              .sort((a, b) => Number(a.step) - Number(b.step))
              .slice(-24);

            historyRef.current = updated;
            setChartHistory(updated);
          }
        } catch (error) {
          console.error('Error fetching state:', error);
        }
      }

      useEffect(() => {
        fetchState();

        return () => {
          if (chartInstance.current) {
            chartInstance.current.dispose();
            chartInstance.current = null;
          }
        };
      }, []);

      useEffect(() => {
        if (!isRunning) return undefined;

        const interval = setInterval(() => {
          handleStep();
        }, 2000);

        return () => clearInterval(interval);
      }, [isRunning]);

      async function handleStep() {
        if (stepInFlight.current) return;

        stepInFlight.current = true;

        try {
          const response = await fetch(
            `${API_BASE}/api/v1/sim/runs/run_live_01/step`,
            {
              method: 'POST',
              headers: {
                'Idempotency-Key': 'step_' + Date.now()
              }
            }
          );

          if (!response.ok) {
            throw new Error(await response.text());
          }

          await fetchState();
        } catch (error) {
          console.error('Step error:', error);
        } finally {
          stepInFlight.current = false;
        }
      }

      async function handleReset() {
        setIsRunning(false);

        try {
          const response = await fetch(
            `${API_BASE}/api/v1/sim/runs/run_live_01/reset`,
            { method: 'POST' }
          );

          if (!response.ok) {
            throw new Error(await response.text());
          }

          historyRef.current = [];
          setChartHistory([]);
          await fetchState(true);
        } catch (error) {
          console.error('Reset error:', error);
        }
      }

      async function handleVerifyAudit() {
        try {
          const response = await fetch(
            `${API_BASE}/api/v1/audit/verify?run_id=run_live_01`
          );

          if (response.ok) {
            setAuditStatus(await response.json());
          }
        } catch (error) {
          console.error(error);
        }
      }

      async function handleRunBacktest() {
        setBacktestLoading(true);

        try {
          const response = await fetch(`${API_BASE}/api/v1/backtests`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              horizon_steps: 168,
              strategies: [
                'B0_CASH',
                'B1_FIXED',
                'B2_CONSERVATIVE',
                'B3_DYNAMIC',
                'B4_CHALLENGE'
              ]
            })
          });

          if (response.ok) {
            const data = await response.json();
            setBacktestResults(data.results || data);
          } else {
            console.error('Backtest failed:', await response.text());
          }
        } catch (error) {
          console.error(error);
        } finally {
          setBacktestLoading(false);
        }
      }

      async function handleRunStress() {
        try {
          const response = await fetch(`${API_BASE}/api/v1/stress/events`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              scenario_id: selectedScenario,
              start_step: kpis ? Number(kpis.step || 0) + 1 : 1,
              duration_hours: 12
            })
          });

          if (response.ok) {
            setStressReport(await response.json());
          } else {
            console.error('Stress test failed:', await response.text());
          }
        } catch (error) {
          console.error(error);
        }
      }

      async function handlePreviewSweep() {
        try {
          const amount = Number(sweepAmount);

          if (!Number.isFinite(amount) || amount <= 0) {
            alert('Enter a valid sweep amount greater than zero.');
            return;
          }

          const response = await fetch(
            `${API_BASE}/api/v1/treasury/sweeps/preview`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                tier: 1,
                amount_cents: String(Math.round(amount * 100))
              })
            }
          );

          if (response.ok) {
            setSweepPreview(await response.json());
          } else {
            console.error('Preview failed:', await response.text());
          }
        } catch (error) {
          console.error(error);
        }
      }

      async function handleExecuteSweep() {
        try {
          const amount = Number(sweepAmount);

          if (!Number.isFinite(amount) || amount <= 0) {
            alert('Enter a valid sweep amount greater than zero.');
            return;
          }

          const response = await fetch(
            `${API_BASE}/api/v1/treasury/sweeps`,
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Idempotency-Key': 'man_swp_' + Date.now()
              },
              body: JSON.stringify({
                tier: 1,
                amount_cents: String(Math.round(amount * 100)),
                confirm: true
              })
            }
          );

          if (response.ok) {
            alert('Sweep executed successfully!');
            setSweepPreview(null);
            await fetchState();
          } else {
            const error = await response.text();
            alert('Sweep rejected: ' + error);
          }
        } catch (error) {
          alert('Error executing sweep: ' + error);
        }
      }

      // Chart: sorted history with separate scales for liquidity and reserves.
      useEffect(() => {
        if (!chartRef.current || chartHistory.length === 0) return;

        if (!chartInstance.current) {
          chartInstance.current = echarts.init(chartRef.current);
        }

        const history = [...chartHistory]
          .sort((a, b) => Number(a.step) - Number(b.step))
          .slice(-24);

        const maxLiquidity = Math.max(
          1,
          ...history.map(point => point.cash || 0),
          ...history.map(point => point.repo || 0)
        ) * 1.1;

        const maxReserve = Math.max(
          1,
          ...history.map(point => point.reserve || 0),
          ...history.map(point => point.hardFloor || 0)
        ) * 1.15;

        chartInstance.current.setOption({
          backgroundColor: 'transparent',
          animationDuration: 300,

          color: ['#8B98A5', '#3FB7A9', '#4EA1FF', '#FF6B6B'],

          tooltip: {
            trigger: 'axis',
            confine: true,
            backgroundColor: '#121923',
            borderColor: '#1E2A38',
            textStyle: { color: '#E6EDF3' },
            formatter: function(params) {
              if (!params || params.length === 0) return '';

              let result = `<strong>Simulation ${params[0].axisValue}</strong>`;

              params.forEach(item => {
                const value = Number(item.value || 0);
                result += `<br/>${item.marker}${item.seriesName}: ${formatUSD(value * 100)}`;
              });

              return result;
            }
          },

          legend: {
            top: 4,
            left: 'center',
            itemGap: 14,
            textStyle: {
              color: '#B7C2CE',
              fontSize: 11
            }
          },

          grid: {
            top: 68,
            left: 78,
            right: 82,
            bottom: 54,
            containLabel: false
          },

          xAxis: {
            type: 'category',
            data: history.map(point => `#${point.step}`),
            boundaryGap: false,
            axisLine: {
              lineStyle: { color: '#344152' }
            },
            axisTick: { show: false },
            axisLabel: {
              color: '#A0ADBA',
              margin: 12,
              hideOverlap: true
            },
            name: 'Simulation step',
            nameLocation: 'middle',
            nameGap: 32,
            nameTextStyle: {
              color: '#8B98A5',
              fontSize: 11
            }
          },

          yAxis: [
            {
              type: 'value',
              name: 'Cash / Repo',
              min: 0,
              max: maxLiquidity,
              position: 'left',
              axisLine: {
                show: true,
                lineStyle: { color: '#536273' }
              },
              axisTick: { show: false },
              axisLabel: {
                color: '#A0ADBA',
                formatter: value => {
                  if (Math.abs(value) >= 1e9) return '$' + (value / 1e9).toFixed(2) + 'B';
                  if (Math.abs(value) >= 1e6) return '$' + (value / 1e6).toFixed(0) + 'M';
                  if (Math.abs(value) >= 1e3) return '$' + (value / 1e3).toFixed(0) + 'K';
                  return '$' + value.toFixed(0);
                }
              },
              nameTextStyle: {
                color: '#A0ADBA'
              },
              splitLine: {
                lineStyle: {
                  color: '#25303D'
                }
              }
            },
            {
              type: 'value',
              name: 'Reserve / Floor',
              min: 0,
              max: maxReserve,
              position: 'right',
              axisLine: {
                show: true,
                lineStyle: { color: '#536273' }
              },
              axisTick: { show: false },
              axisLabel: {
                color: '#A0ADBA',
                formatter: value => {
                  if (Math.abs(value) >= 1e9) return '$' + (value / 1e9).toFixed(2) + 'B';
                  if (Math.abs(value) >= 1e6) return '$' + (value / 1e6).toFixed(1) + 'M';
                  if (Math.abs(value) >= 1e3) return '$' + (value / 1e3).toFixed(0) + 'K';
                  return '$' + value.toFixed(0);
                }
              },
              nameTextStyle: {
                color: '#A0ADBA'
              },
              splitLine: { show: false }
            }
          ],

          series: [
            {
              name: 'Cash Buffer',
              type: 'line',
              yAxisIndex: 0,
              data: history.map(point => point.cash),
              showSymbol: true,
              symbol: 'circle',
              symbolSize: 5,
              lineStyle: { width: 3 }
            },
            {
              name: 'Repo Position',
              type: 'line',
              yAxisIndex: 0,
              data: history.map(point => point.repo),
              showSymbol: true,
              symbol: 'circle',
              symbolSize: 5,
              lineStyle: { width: 2 }
            },
            {
              name: 'R_total (Target)',
              type: 'line',
              yAxisIndex: 1,
              data: history.map(point => point.reserve),
              showSymbol: true,
              symbol: 'circle',
              symbolSize: 7,
              lineStyle: { width: 3 }
            },
            {
              name: 'F_hard (Floor)',
              type: 'line',
              yAxisIndex: 1,
              data: history.map(point => point.hardFloor),
              showSymbol: true,
              symbol: 'circle',
              symbolSize: 6,
              lineStyle: {
                width: 2,
                type: 'dashed'
              }
            }
          ]
        }, true);

        chartInstance.current.resize();
      }, [chartHistory, tab]);

      useEffect(() => {
        const resizeChart = () => {
          if (chartInstance.current) {
            chartInstance.current.resize();
          }
        };

        window.addEventListener('resize', resizeChart);

        return () => {
          window.removeEventListener('resize', resizeChart);
        };
      }, []);

      const tabs = [
        'dashboard',
        'forecast',
        'sweep',
        'backtest',
        'stress',
        'audit'
      ];

      return (
        <div className="flex flex-col min-h-screen">

          <header className="border-b border-borderDark bg-panelDark px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
            <div className="flex items-center flex-wrap gap-3">
              <span className="text-xl font-bold tracking-wider text-accentBlue">
                ⚡ RESERVE JUGGLER
              </span>

              <span className="bg-blue-950 border border-blue-800 text-blue-300 text-xs px-2.5 py-1 rounded font-mono">
                SIMULATION-ONLY
              </span>

              <span className="bg-emerald-950 border border-emerald-800 text-emerald-300 text-xs px-2.5 py-1 rounded font-mono">
                CYCLE #{kpis ? (kpis.step ?? 0) : 0} (REPLAY)
              </span>
            </div>

            <nav className="flex flex-wrap gap-1 bg-bgDark p-1 rounded-lg border border-borderDark text-sm">
              {tabs.map(name => (
                <button
                  key={name}
                  onClick={() => setTab(name)}
                  className={`px-3 py-1.5 rounded-md capitalize font-medium ${
                    tab === name
                      ? 'bg-panelDark text-accentBlue border border-borderDark'
                      : 'text-textMuted hover:text-textLight'
                  }`}
                >
                  {name}
                </button>
              ))}
            </nav>

            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={handleStep}
                className="bg-panelDark hover:bg-borderDark border border-borderDark px-3 py-1.5 rounded text-sm font-semibold"
              >
                ▶ Step 1h
              </button>

              <button
                onClick={() => setIsRunning(value => !value)}
                className={`px-3 py-1.5 rounded text-sm font-semibold ${
                  isRunning
                    ? 'bg-amber-600 hover:bg-amber-700 text-white'
                    : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                }`}
              >
                {isRunning ? '⏸ Pause' : '▶ Auto-Play'}
              </button>

              <button
                onClick={handleReset}
                className="bg-red-950 hover:bg-red-900 border border-red-800 text-red-300 px-3 py-1.5 rounded text-sm font-semibold"
              >
                ↺ Reset
              </button>
            </div>
          </header>

          <main className="flex-1 p-6 max-w-7
